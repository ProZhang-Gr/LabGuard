[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labguard"
version = "0.1.0"
description = "LabGuard: grounding laboratory safety rules into executable monitors for robot manipulation (reproduction)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.2", "transformers>=4.51", "peft>=0.12", "accelerate>=0.30", "tokenizers>=0.19"]
qlora = ["bitsandbytes>=0.43"]
api = ["openai>=1.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["labguard*"]

[tool.setuptools.package-data]
labguard = ["**/*.yaml", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
